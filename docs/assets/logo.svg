<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <!-- Fondo Base -->
  <rect width="512" height="512" rx="96" fill="#0a0a0b" />
  
  <!-- Mapa Topográfico de Fondo (Curvas de nivel) -->
  <g stroke="#b8853a" stroke-width="1.5" fill="none" opacity="0.12">
    <!-- Esquina Superior Izquierda -->
    <path d="M-50,150 C50,100 150,50 200,100 C250,150 250,250 200,300 C150,350 50,350 -50,300" />
    <path d="M-50,200 C30,150 120,100 160,140 C200,180 200,260 160,300 C120,340 30,340 -50,300" />
    <path d="M-50,250 C10,210 90,160 120,190 C150,220 150,270 120,300 C90,330 10,330 -50,300" />
    
    <!-- Esquina Superior Derecha -->
    <path d="M562,100 C500,50 400,50 350,100 C300,150 300,250 350,300 C400,350 500,350 562,300" />
    <path d="M562,150 C480,100 380,100 340,140 C300,180 300,260 340,300 C380,340 480,340 562,300" />
    <path d="M562,200 C460,150 360,150 330,190 C300,230 300,270 330,300 C360,330 460,330 562,300" />
    
    <!-- Esquina Inferior Izquierda -->
    <path d="M-50,362 C50,412 150,462 200,412 C250,362 250,262 200,212 C150,162 50,162 -50,212" />
    <path d="M-50,412 C30,462 120,512 160,472 C200,432 200,352 160,312 C120,272 30,272 -50,312" />
    <path d="M-50,462 C10,512 90,562 120,522 C150,482 150,432 120,402 C90,372 10,372 -50,402" />

    <!-- Esquina Inferior Derecha -->
    <path d="M562,412 C500,462 400,462 350,412 C300,362 300,262 350,212 C400,162 500,162 562,212" />
    <path d="M562,462 C480,512 380,512 340,472 C300,432 300,352 340,312 C380,272 480,272 562,312" />
    <path d="M562,512 C460,562 360,562 330,522 C300,482 300,442 330,412 C360,382 460,382 562,412" />
  </g>

  <!-- Soportes tácticos en las esquinas (HUD) -->
  <g stroke="#b8853a" stroke-width="6" fill="none" stroke-linecap="square">
    <polyline points="32,96 32,32 96,32" />
    <polyline points="416,32 480,32 480,96" />
    <polyline points="32,416 32,480 96,480" />
    <polyline points="416,480 480,480 480,416" />
  </g>

  <!-- ESCUDO CENTRAL (Reducido y Posicionado Arriba) -->
  <!-- translate mueve el escudo hacia arriba, scale lo hace más pequeño -->
  <g transform="translate(256, 220) scale(0.75) translate(-256, -256)">
    <!-- Borde exterior grueso -->
    <path d="M256 64 L416 144 V320 L256 448 L96 320 V144 Z" fill="none" stroke="#c8c6c0" stroke-width="12" stroke-linejoin="miter" />
    
    <!-- Borde interior fino (Ámbar) -->
    <path d="M256 96 L384 160 V304 L256 408 L128 304 V160 Z" fill="#141416" stroke="#b8853a" stroke-width="4" stroke-linejoin="miter" />
    
    <!-- Marcas de HUD tácticas -->
    <g stroke="#b8853a" stroke-width="2" opacity="0.4">
      <line x1="256" y1="96" x2="256" y2="120" />
      <line x1="256" y1="384" x2="256" y2="408" />
      <line x1="128" y1="232" x2="152" y2="232" />
      <line x1="360" y1="232" x2="384" y2="232" />
    </g>

    <!-- Checkmark (Color Ámbar) -->
    <polyline points="180,240 230,290 340,170" fill="none" stroke="#b8853a" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- Brillo interior del checkmark -->
    <polyline points="180,240 230,290 340,170" fill="none" stroke="#d49a42" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" opacity="0.8" />
  </g>

  <!-- TEXTO EN LA PARTE INFERIOR (Totalmente Separado) -->
  <!-- Texto EFTARKOV -->
  <text x="256" y="425" font-family="'Arial Narrow', sans-serif" font-weight="bold" font-size="32" fill="#c8c6c0" text-anchor="middle" letter-spacing="8">EFTARKOV</text>
  
  <!-- Texto BUDDY -->
  <text x="256" y="460" font-family="'Arial Narrow', sans-serif" font-weight="bold" font-size="20" fill="#b8853a" text-anchor="middle" letter-spacing="12">BUDDY</text>
</svg>